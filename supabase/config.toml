# Supabase CLI configuration for the local stack (`supabase start`). Everything not set here keeps
# the CLI's default. Schema changes are migration files in `supabase/migrations/`, committed and
# reviewed; the loop's post-merge step applies new files to the dev database.
project_id = "app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
enable_signup = false

[storage]
enabled = true
